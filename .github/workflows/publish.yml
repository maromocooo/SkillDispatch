name: Manually approved npm publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Reviewed release tag, e.g. v0.1.0'
        required: true
        type: string
      confirm:
        description: 'Publish the reviewed release to npm'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  publish:
    # Disabled until the maintainer explicitly configures all release safeguards.
    if: inputs.confirm && vars.NPM_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TYPESAFE_API_KEY: ''
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag syntax
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed main ancestry and version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG !== `v${p.version}`) process.exit(1)'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm pack --pack-destination artifacts
      - run: node scripts/package-smoke.mjs artifacts/skilldispatch-0.1.0.tgz
      - name: Publish reviewed tarball using OIDC
        run: npm publish artifacts/skilldispatch-0.1.0.tgz --access public --provenance --ignore-scripts
