# Copy to .skilldispatch.yaml or ~/.config/skilldispatch/config.yaml.
# PR1 is offline: only the mock provider is implemented.
router:
  provider: mock
  timeoutMs: 2500
  # Optional deterministic fixture scores, keyed by skill ID or name.
  # Omit mock to use the simple token-overlap fallback.
  mock:
    defaultProbability: 0.04
    scores:
      react-patterns: 0.95
      frontend-testing: 0.91
      accessibility-review: 0.88
      deployment: 0.04
policy:
  threshold: 0.75
  maxSkills: 4
discovery:
  agents:
    - codex
    - claude-code
