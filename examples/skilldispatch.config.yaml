# Copy to .skilldispatch.yaml or ~/.config/skilldispatch/config.yaml.
# Supply TYPESAFE_API_KEY via the environment, never this file.
# Hooks read user config only by default; project skill discovery still uses CWD.
# This opt-in can only be set in ~/.config/skilldispatch/config.yaml:
# hook:
#   trustProjectConfig: true
# Hook execution modes are user-owned even when project config is trusted.
# User config only (both defaults are shadow):
# hook:
#   modes:
#     claude: advisory  # then run: skilldispatch hooks install claude
#     codex: shadow    # advisory is not supported for Codex
router:
  provider: jev
  timeoutMs: 2500
  jev:
    model: jev-latest
    chunkSize: 48
    concurrency: 2
    requestTimeoutMs: 1800
    maxRetries: 0
policy:
  threshold: 0.75
  maxSkills: 4
discovery:
  agents: [codex, claude-code]
# Hook-only persistence; route/eval/discover never write traces.
telemetry:
  enabled: true
  prompt: hash
  # Defaults to the data directory; this optional override is absolute or ~/.
  # tracePath: ~/.local/share/skilldispatch/traces.jsonl
